version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: tang
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

homebrew_casks:
  - name: tang
    repository:
      owner: ansel1
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/ansel1/tang"
    description: "Command-line tool for summarizing go test results in real time"
    license: "MIT"
    binaries:
      - tang
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/tang"]
          end
